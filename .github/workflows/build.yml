#Workflow name
name: CI/CD Pipeline

on:
  #Manually trigger workflow runs
  workflow_dispatch:
  #Trigger the workflow on push from the main branch
  push:
    branches:
      - main
      #Rama de trabajo creada para este laboratorio (estrategia trunk based)
      - feature/cicd-pipeline
  #Tambien se ejecuta sobre los pull request dirigidos a main, de modo que los
  #checks aparecen dentro del PR antes de autorizar el merge
  pull_request:
    branches:
      - main

jobs:

  #Test's job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      #Las pruebas usan H2 en memoria (src/test/resources/application.properties),
      #por eso no hace falta ningun servidor MySQL en el runner.
      - name: Run tests
        run: mvn -B test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  #Sonar's job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          #SonarCloud necesita el historico completo para asignar los issues
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      #verify ejecuta las pruebas y genera el informe de JaCoCo que Sonar lee
      - name: Build project
        run: mvn -B clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Isaac200301_lab1arq
          -Dsonar.organization=isaac200301
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN

  #Snyk's job
  snyk:
    name: Snyk security scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        #Las vulnerabilidades se reportan pero no detienen la entrega
        continue-on-error: true

  #Build's job
  build:
    name: Build
    needs: [sonar, snyk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: target/lab1arq.jar

      #Publica la imagen en Docker Hub, como en el laboratorio guiado
      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: rumpeles123/lab1arq
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  #Deploy's job
  deploy:
    name: Deploy to Google Cloud Run
    needs: build
    runs-on: ubuntu-latest
    #Solo se despliega lo que ya esta en main: un pull request abierto corre
    #las pruebas y el analisis, pero no toca el entorno desplegado.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      #Cloud Run solo despliega imagenes alojadas en Artifact Registry,
      #por eso la imagen se publica tambien alli ademas de en Docker Hub.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image to Artifact Registry
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lab1arq/lab1arq
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lab1arq/lab1arq
        run: |
          gcloud run deploy lab1arq \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud" \
            --set-env-vars "DB_HOST=${{ secrets.DB_HOST }}" \
            --set-env-vars "DB_PORT=${{ secrets.DB_PORT }}" \
            --set-env-vars "DB_NAME=${{ secrets.DB_NAME }}" \
            --set-env-vars "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}"

          URL=$(gcloud run services describe lab1arq \
            --region "${{ secrets.GCP_REGION }}" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Servicio desplegado en: $URL"

      #Comprueba que la aplicacion quedo respondiendo en la nube y deja la
      #evidencia en el log del pipeline
      - name: Verify deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 15); do
            if curl -sSf "$URL/api/customers" > /dev/null 2>&1; then
              echo "La API responde en la nube."
              echo "GET $URL/api/customers ->"
              curl -sS "$URL/api/customers"
              exit 0
            fi
            echo "Intento $i de 15: el servicio aun no responde, esperando 10s..."
            sleep 10
          done
          echo "El servicio no respondio dentro del tiempo esperado"
          exit 1
