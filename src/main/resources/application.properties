spring.application.name=lab1arq
# Cloud Run inyecta el puerto en la variable PORT; en local se usa 8088.
server.port=${PORT:8088}

# --- Base de datos ---------------------------------------------------------
# Las credenciales NO viven en este archivo: se leen de variables de entorno.
# Asi el archivo puede versionarse sin exponer la contrasena del servidor.
#
# La sintaxis ${VARIABLE:valor_por_defecto} usa el valor tras los dos puntos
# cuando la variable no esta definida. DB_PASSWORD es la unica sin defecto:
# si falta, la aplicacion falla al arrancar con
#   Could not resolve placeholder 'DB_PASSWORD'
# que dice exactamente que hace falta, en vez de un "Access denied" confuso.
#
# Como definirla: ver la seccion "Credenciales" del README.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:udeabank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -------------------------------------------------------
# El dialecto no se declara: Hibernate 7 lo detecta de los metadatos JDBC.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Transacciones ---------------------------------------------------------
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# --- Web -------------------------------------------------------------------
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.favor-parameter=false

# --- CORS ------------------------------------------------------------------
# Origenes autorizados a consumir la API, separados por coma. En local basta
# con el servidor de Vite; en la nube se agrega la URL del frontend desplegado
# mediante la variable de entorno CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
