# Perfil de nube: la aplicacion corre en Cloud Run y persiste en PostgreSQL
# (Supabase). Se activa con SPRING_PROFILES_ACTIVE=cloud.
#
# Este archivo no contiene credenciales: todas se resuelven desde variables de
# entorno definidas en el servicio de Cloud Run.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea las tablas a partir de las entidades en el primer arranque.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# DevTools no debe activarse en un entorno desplegado.
spring.devtools.restart.enabled=false
