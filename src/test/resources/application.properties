# Configuracion exclusiva de las pruebas.
#
# El archivo de src/test/resources tiene precedencia sobre el de
# src/main/resources, de modo que las pruebas nunca intentan conectarse al
# MySQL de desarrollo. Esto es lo que permite que el job de pruebas corra en
# el runner de GitHub Actions, donde no hay ningun servidor de base de datos.

spring.application.name=lab1arq-test

# Base de datos en memoria, nueva en cada ejecucion.
spring.datasource.url=jdbc:h2:mem:udeabank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.devtools.restart.enabled=false
app.cors.allowed-origins=http://localhost:5173
